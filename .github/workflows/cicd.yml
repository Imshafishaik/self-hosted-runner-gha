name: Deploy to Tomcat via Manager API

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    # runs-on: ubuntu-latest
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        

      # - name: Set up JDK
      #   uses: actions/setup-java@v3
      #   with:
      #     distribution: 'temurin' 
      #     java-version: '11'

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build WAR using Maven
        run: mvn clean package -DskipTests

      # - name: Build WAR using Maven
      #   run: mvn clean install
       # run: mvn clean package -DskipTests

      - name: Deploy WAR to Tomcat
        run: |
              WAR_FILE=$(ls target/*.war | head -n 1)
              APP_NAME=madhuapp
              curl -u "${{ secrets.TOMCAT_USERNAME }}:${{ secrets.TOMCAT_PASSWORD }}" \
                --upload-file "$WAR_FILE" \
                "http://${{ secrets.TOMCAT_HOST }}:8081/manager/text/deploy?path=/$APP_NAME&update=true"
